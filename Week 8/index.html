<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f8;
            color: #14213d;
            padding: 15px;
        }

        /* Tasks 8.1 and 8.3: Main Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 170px 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 15px;
            min-height: 90vh;
        }

        .header {
            grid-area: head;
            padding: 25px 15px;
            background: #14213d;
            color: white;
            border-radius: 8px;
        }

        .sidebar {
            grid-area: side;
            padding: 20px 15px;
            background: #dce6ff;
            border-radius: 8px;
        }

        .sidebar h2 {
            margin-bottom: 10px;
        }

        .sidebar ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        /* Task 8.2: Responsive Grid */
        .main {
            grid-area: main;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            align-content: start;
            min-width: 0;
        }

        /* Task 8.4: Icon and Text with Flexbox */
        .box {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            padding: 18px 12px;
            background: white;
            border-radius: 10px;
            border: 1px solid #dce3f0;
            min-width: 0;
            box-shadow: 0 3px 8px #14213d10;
        }

        .icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            border-radius: 10px;
            background: #e0e7ff;
            font-size: 24px;
        }

        .box-info {
            min-width: 0;
        }

        .box-info h3 {
            margin-bottom: 5px;
            font-size: 18px;
        }

        .box-info p {
            color: #64748b;
            font-size: 13px;
        }

        .footer {
            grid-area: foot;
            padding: 25px;
            background: #14213d;
            color: white;
            text-align: center;
            border-radius: 8px;
        }

        /* Mobile Responsive Layout */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .dashboard {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "head"
                    "side"
                    "main"
                    "foot";
            }

            .sidebar {
                padding: 15px;
            }

            .main {
                grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            }

            .box {
                gap: 8px;
                padding: 12px 8px;
            }

            .icon {
                width: 38px;
                height: 38px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header class="header">
            <h1>My Dashboard</h1>
        </header>

        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <main class="main">

            <div class="box">
                <div class="icon">👤</div>
                <div class="box-info">
                    <h3>120</h3>
                    <p>Users</p>
                </div>
            </div>

            <div class="box">
                <div class="icon">💰</div>
                <div class="box-info">
                    <h3>Rs 45k</h3>
                    <p>Sales</p>
                </div>
            </div>

            <div class="box">
                <div class="icon">📦</div>
                <div class="box-info">
                    <h3>36</h3>
                    <p>Orders</p>
                </div>
            </div>

            <div class="box">
                <div class="icon">⭐</div>
                <div class="box-info">
                    <h3>4.8</h3>
                    <p>Rating</p>
                </div>
            </div>

            <div class="box">
                <div class="icon">💬</div>
                <div class="box-info">
                    <h3>18</h3>
                    <p>Messages</p>
                </div>
            </div>

            <div class="box">
                <div class="icon">✅</div>
                <div class="box-info">
                    <h3>92%</h3>
                    <p>Completed</p>
                </div>
            </div>

        </main>

        <footer class="footer">
            <p>Made with CSS Grid & Flexbox</p>
        </footer>

    </div>

</body>
</html>
