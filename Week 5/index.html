<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    /* Task 5.4: CSS Variables */
    :root {
        --primary-color: #315bea;
        --background-color: #eef2ff;
        --text-color: #1e293b;
        --card-color: #ffffff;
        --border-color: #dddddd;
        --spacing: 20px;
    }

    /* Task 5.2: Universal Selector */
    * {
        box-sizing: border-box;
    }

    /* Task 5.3: Fonts, colours and line-height */
    body {
        font-family: 'Poppins', sans-serif;
        background-color: var(--background-color);
        color: var(--text-color);
        margin: 0;
        padding: var(--spacing);
        line-height: 1.6;
    }

    /* Task 5.2: ID Selector */
    #hero {
        background-color: var(--primary-color);
        color: white;
        text-align: center;
        padding: 30px;
        border-radius: 10px;
        margin-bottom: var(--spacing);
    }

    /* Task 5.2 and 5.3: Element Selector */
    h1 {
        font-size: 32px;
        margin-bottom: 10px;
        line-height: 1.2;
    }

    /* Task 5.2: Class Selector */
    .card {
        background-color: var(--card-color);
        padding: var(--spacing);
        margin-bottom: var(--spacing);
        border-radius: 10px;
    }

    h2 {
        margin-top: 0;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background-color: var(--primary-color);
        color: white;
        text-align: left;
    }

    th, td {
        padding: 12px;
        border-bottom: 1px solid var(--border-color);
    }

    input {
        padding: 8px;
        margin-top: 5px;
        max-width: 100%;
    }

    button {
        background-color: var(--primary-color);
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }
</style>

</head><body>
    <header id="hero">
        <h1>Coding Club</h1>
        <p>Learn. Build. Share.</p>
    </header><section class="card">
    <h2>Upcoming Events</h2>

    <table>
        <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>
        <tr>
            <td>HTML Workshop</td>
            <td>12 Nov</td>
            <td>Lab 1</td>
        </tr>
        <tr>
            <td>Hackathon</td>
            <td>20 Nov</td>
            <td>Seminar Hall</td>
        </tr>
    </table>
</section>

<section class="card">
    <h2>Register</h2>

    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" placeholder="Your name">
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="you@example.com">
        <br><br>

        <button type="submit">Register</button>
    </form>
</section>

</body>
</html>
