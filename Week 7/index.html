<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab - Learn Web Development</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #14213d;
            background: white;
        }

        /* Task 7.1: Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px 25px;
            background: #14213d;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-right,
        .nav-links {
            display: flex;
            align-items: center;
        }

        .nav-right {
            gap: 25px;
        }

        .nav-links {
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #ffb703;
        }

        .signup,
        .get-started {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #ffb703;
            color: #14213d;
            font-weight: bold;
            cursor: pointer;
        }

        /* Task 7.2: Banner */
        .banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            padding: 35px 15px;
            background: #315bea;
            color: white;
            text-align: center;
        }

        .banner h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        .banner p {
            margin: 0 0 20px;
            line-height: 1.6;
        }

        /* Task 7.3: Cards */
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 25px 20px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            flex: 1 1 200px;
            min-width: 0;
            padding: 25px 15px;
            border-radius: 12px;
            background: #eef2ff;
            text-align: center;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card p {
            margin: 0;
            font-size: 14px;
        }

        /* Task 7.4: Landing Page Sections */
        .section-title {
            margin: 30px 15px 0;
            text-align: center;
        }

        .footer {
            padding: 22px 15px;
            background: #14213d;
            color: white;
            text-align: center;
        }

        .footer p {
            margin: 0;
        }

        /* Mobile responsive layout */
        @media (max-width: 480px) {
            .navbar {
                padding: 15px 10px;
                gap: 8px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-right {
                gap: 10px;
            }

            .nav-links {
                gap: 8px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .signup {
                padding: 8px;
                font-size: 11px;
            }

            .banner h1 {
                font-size: 26px;
            }

            .cards {
                padding: 20px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">CodeLab</div>

        <div class="nav-right">
            <nav class="nav-links">
                <a href="#home">Home</a>
                <a href="#courses">Courses</a>
                <a href="#contact">Contact</a>
            </nav>

            <button class="signup"
                onclick="document.getElementById('courses').scrollIntoView({behavior:'smooth'})">
                Sign up
            </button>
        </div>
    </header>

    <!-- Banner -->
    <main>
        <section class="banner" id="home">
            <h1>Learn Web Development</h1>
            <p>Start from zero. Build real projects.</p>

            <button class="get-started"
                onclick="document.getElementById('courses').scrollIntoView({behavior:'smooth'})">
                Get started
            </button>
        </section>

        <!-- Course Cards -->
        <section id="courses">
            <h2 class="section-title">Explore Our Skills</h2>

            <div class="cards">
                <article class="card">
                    <h2>HTML</h2>
                    <p>Build the structure</p>
                </article>

                <article class="card">
                    <h2>CSS</h2>
                    <p>Make it beautiful</p>
                </article>

                <article class="card">
                    <h2>JavaScript</h2>
                    <p>Make it smart</p>
                </article>

                <article class="card">
                    <h2>Git</h2>
                    <p>Save your work</p>
                </article>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer" id="contact">
        <p>© 2026 CodeLab | Keep Learning, Keep Building!</p>
    </footer>

</body>
</html>
