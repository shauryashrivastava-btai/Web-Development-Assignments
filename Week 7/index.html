<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 - Flexbox Navbar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6ff;
        }

        /* Task 7.1: Navbar using Flexbox */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #14213d;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #ffb703;
        }

        .signup {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #ffb703;
            color: #14213d;
            font-weight: bold;
            cursor: pointer;
        }

        /* Mobile-friendly navbar */
        @media (max-width: 480px) {
            .navbar {
                padding: 15px 12px;
            }

            .nav-right {
                gap: 10px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .logo {
                font-size: 18px;
            }

            .signup {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">

        <!-- Logo on the left -->
        <div class="logo">CodeLab</div>

        <!-- Links and button on the right -->
        <div class="nav-right">

            <nav class="nav-links">
                <a href="#home">Home</a>
                <a href="#courses">Courses</a>
                <a href="#contact">Contact</a>
            </nav>

            <button class="signup">Sign up</button>

        </div>

    </header>

</body>
</html>
