<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 7 - Flexbox Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #14213d;
        }

        /* Task 7.1: Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #14213d;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: #ffb703;
        }

        .signup,
        .get-started {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #ffb703;
            color: #14213d;
            font-weight: bold;
            cursor: pointer;
        }

        /* Task 7.2: Banner */
        .banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            padding: 30px 15px;
            background: #315bea;
            color: white;
            text-align: center;
        }

        .banner h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        .banner p {
            margin: 0 0 20px;
        }

        /* Task 7.3: Flexbox Cards */
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 25px 20px;
        }

        .card {
            flex: 1 1 200px;
            min-width: 0;
            padding: 25px 15px;
            border-radius: 12px;
            background: #eef2ff;
            text-align: center;
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card p {
            margin: 0;
            font-size: 14px;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .navbar {
                padding: 15px 10px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-right {
                gap: 10px;
            }

            .nav-links {
                gap: 8px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .signup {
                padding: 8px;
                font-size: 11px;
            }

            .banner h1 {
                font-size: 26px;
            }

            .cards {
                padding: 20px 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Task 7.1: Navbar -->
    <header class="navbar">
        <div class="logo">CodeLab</div>

        <div class="nav-right">
            <nav class="nav-links">
                <a href="#home">Home</a>
                <a href="#courses">Courses</a>
                <a href="#contact">Contact</a>
            </nav>

            <button class="signup">Sign up</button>
        </div>
    </header>

    <!-- Task 7.2: Banner -->
    <section class="banner" id="home">
        <h1>Learn Web Development</h1>
        <p>Start from zero. Build real projects.</p>
        <button class="get-started">Get started</button>
    </section>

    <!-- Task 7.3: Four Responsive Cards -->
    <section class="cards" id="courses">

        <div class="card">
            <h2>HTML</h2>
            <p>Build the structure</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Make it beautiful</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Make it smart</p>
        </div>

        <div class="card">
            <h2>Git</h2>
            <p>Save your work</p>
        </div>

    </section>

</body>
</html>
