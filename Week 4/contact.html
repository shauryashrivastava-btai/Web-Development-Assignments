<main>
    <h2>Get in Touch</h2>
    <p>Have questions about our Coding Club? Contact us!</p>

    <p><strong>Email:</strong> codingclub@example.com</p>
    <p><strong>Address:</strong> Computer Lab, College Campus</p>

    <h2>Send Us a Message</h2>

    <form>
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="message">Message:</label>
        <br>
        <textarea id="message" name="message" rows="5" cols="30" required></textarea>
        <br><br>

        <button type="submit">Send Message</button>
    </form>
</main>
