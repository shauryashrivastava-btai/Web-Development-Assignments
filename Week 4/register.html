<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to Coding Club. Explore upcoming events and register to join.">
    <meta name="author" content="Shaurya">
    <meta name="keywords" content="Coding Club, HTML, Web Development, Registration"><title>Coding Club - Registration</title>

<link rel="icon" type="image/png" href="../img/fevicon.png">

</head>
<body><h1>Student Registration</h1>

<form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Your name">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email">
    <br><br>
    <br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password">
    <br><br>
    <br><br>

<label for="dob">Date of Birth:</label>
<input type="date" id="dob" name="dob">
<br><br>

<label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone">
<br><br>

Gender:
<input type="radio" id="male" name="gender" value="Male">
<label for="male">Male</label>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label>
<br><br>Interests:
<input type="checkbox" id="web" name="interests" value="Web">
<label for="web">Web</label>

<input type="checkbox" id="dsa" name="interests" value="DSA">
<label for="dsa">DSA</label>
<br><br><label for="branch">Branch:</label>
<select id="branch" name="branch">
<option value="BCA">BCA</option>
<option value="BTech">B.Tech</option>
<option value="BSc">B.Sc</option>
<option value="MCA">MCA</option>
</select>
<br><br>

<label for="message">Why do you want to join?</label>
<br>

<textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>

<button type="submit">Register</button>
</form>
<h2>Upcoming Events</h2><table border="1">
    <caption>Club Events</caption><thead>
    <tr>
        <th>Event</th>
        <th>Date</th>
        <th>Venue</th>
    </tr>
</thead>

<tbody>
    <tr>
        <td>HTML Workshop</td>
        <td>12 Nov</td>
        <td>Lab 1</td>
    </tr>

    <tr>
        <td>Hackathon</td>
        <td>20 Nov</td>
        <td>Seminar Hall</td>
    </tr>
</tbody>

<tfoot>
    <tr>
        <td colspan="3">Total events: 2</td>
    </tr>
</tfoot>

</table>
</body>
</html>
